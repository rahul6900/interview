constructor (name,age){

}

show (){

}

}

    constructor(s,age,name2){

        super(s);
this.name2=name2

// incapsulation
class Encapsulation {
    #name;

    constructor(name){
        this.#name = name;
    }

    getName(){
        return this.#name;
    }
}

class Encapsulation2 extends Encapsulation {
    constructor(name){
        super(name);
    }

      test(){
        console.log(this.#name); 
    }
}

let obj = new Encapsulation2("rahul");

console.log(obj.getName()); // ✅ rahul



// static

class MathUtils {
    static add(a, b){
        return a + b;
    }
}

console.log(MathUtils.add(2,3)); // 5
